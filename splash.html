<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Mahallah TV</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #005a31;
    overflow: hidden;
  }

  #splash-wrap {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-orient: vertical; -webkit-box-direction: normal;
    -webkit-flex-direction: column; flex-direction: column;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
  }

  /* Logo ditampilkan apa adanya, TANPA background/box/border putih di baliknya */
  #splash-logo {
    max-width: 200px;
    max-height: 200px;
    width: auto;
    height: auto;
    -o-object-fit: contain;
    object-fit: contain;
  }

  #splash-bar-track {
    width: 240px;
    max-width: 60%;
    height: 6px;
    margin-top: 36px;
    background: rgba(255, 255, 255, 0.25);
    border-radius: 6px;
    overflow: hidden;
  }

  #splash-bar-fill {
    width: 0%;
    height: 100%;
    background: #ffffff;
    border-radius: 6px;
    -webkit-transition: width 8s linear;
    transition: width 8s linear;
  }
</style>
</head>
<body>

  <div id="splash-wrap">
    <img id="splash-logo" src="asset/logo.png" alt="Mahallah TV">
    <div id="splash-bar-track">
      <div id="splash-bar-fill"></div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var DURATION_MS = 8000;
      var NEXT_PAGE = 'index.html'; // index.html sendiri yang akan menampilkan
                                     // halaman aktivasi ATAU halaman utama,
                                     // tergantung status lisensi (activation-check.js)

      var fill = document.getElementById('splash-bar-fill');

      // Beri jeda sangat singkat sebelum mulai transisi width, supaya
      // browser/WebView sempat "melihat" width:0% dulu (kalau langsung
      // di-set 100% tanpa jeda, sebagian WebView lawas melewati transisinya).
      setTimeout(function () {
        fill.style.width = '100%';
      }, 30);

      setTimeout(function () {
        window.location.href = NEXT_PAGE;
      }, DURATION_MS);
    })();
  </script>

</body>
</html>
